<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Default SEO - each page updates these at runtime via useSeo() -->
    <title>ShopEase - Shop online with fast delivery</title>
    <meta name="description" content="Shop electronics, fashion and home essentials at ShopEase - secure checkout, fast delivery and live order tracking." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#ea580c" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph / social sharing -->
    <meta property="og:site_name" content="ShopEase" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ShopEase - Shop online with fast delivery" />
    <meta property="og:description" content="Electronics, fashion and home essentials with secure checkout and live order tracking." />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Site-wide structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "OnlineStore",
        "name": "ShopEase",
        "description": "Online store for electronics, fashion and home essentials."
      }
    </script>
  </head>
  <body>
    <noscript>
      <div style="padding:24px;font-family:system-ui,sans-serif;text-align:center">
        <h1>ShopEase</h1>
        <p>Please enable JavaScript to shop electronics, fashion and home essentials at ShopEase.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
